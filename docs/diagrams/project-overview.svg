<?xml version="1.0" encoding="UTF-8"?>
<!--
  Insurance Premium Prediction - project overview.

  HAND-AUTHORED SVG. This file is its own source: edit it directly.
  It is NOT generated by mermaid-cli, unlike the other diagrams in this
  folder, so there is no .mmd beside it and running `mmdc` here would
  produce nothing.

  Layout rules it follows: 4px grid, orthogonal connectors with r=8 elbows,
  every arrow label on an opaque mask with a 6px or larger gap to its stroke,
  one bottom legend strip. Fonts are a system stack on purpose: GitHub strips
  external font links out of embedded SVG, so a webfont would silently fall
  back to something unmeasured.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%"
     style="max-width:960px" role="img"
     aria-labelledby="project-overview-title project-overview-desc">
  <title id="project-overview-title">Insurance Premium Prediction system overview</title>
  <desc id="project-overview-desc">A training row turns the insurance CSV into a model bundle and logs each run to MLflow. DVC versions both the data and the bundle to Azure Blob Storage. A delivery row runs GitHub Actions through a deploy gate that ships nothing when a test fails, and the same bundle is baked into the serving image that becomes the live API.</desc>

  <defs>
    <marker id="po-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="po-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6d28d9"/>
    </marker>
    <marker id="po-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
    </marker>
    <marker id="po-arrow-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .n { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         font-size: 12px; font-weight: 600; fill: #111827; }
    .s { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
         font-size: 9px; fill: #64748b; }
    .a { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
         font-size: 8px; fill: #475569; letter-spacing: 0.06em; }
    .z { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
         font-size: 8px; fill: #64748b; letter-spacing: 0.14em; }
  </style>

  <rect width="960" height="540" fill="#f8fafc"/>

  <!-- ===== zones (z-order: bg, zones, arrows, nodes) ===== -->
  <rect x="40" y="128" width="632" height="108" rx="8"
        fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="6 4"/>
  <rect x="52" y="132" width="72" height="12" rx="2" fill="#f8fafc"/>
  <text class="z" x="56" y="141">01 TRAIN</text>

  <rect x="40" y="368" width="632" height="108" rx="8"
        fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="6 4"/>
  <rect x="52" y="372" width="64" height="12" rx="2" fill="#f8fafc"/>
  <text class="z" x="56" y="381">02 SHIP</text>

  <!-- ===== arrows ===== -->

  <!-- 1. insurance data to training pipeline -->
  <line x1="208" y1="190" x2="280" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#po-arrow)"/>
  <rect x="218" y="170" width="52" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="244" y="179" text-anchor="middle">READ CSV</text>

  <!-- 2. training pipeline to model bundle -->
  <line x1="432" y1="190" x2="504" y2="190" stroke="#475569" stroke-width="1.2" marker-end="url(#po-arrow)"/>
  <rect x="438" y="170" width="60" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="468" y="179" text-anchor="middle">SAVE MODEL</text>

  <!-- 3. training pipeline to mlflow -->
  <line x1="356" y1="160" x2="356" y2="100" stroke="#475569" stroke-width="1"
        stroke-dasharray="4,3" marker-end="url(#po-arrow)"/>
  <rect x="366" y="108" width="44" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="370" y="117">LOG RUN</text>

  <!-- 4. insurance data to drift check -->
  <line x1="132" y1="160" x2="132" y2="100" stroke="#475569" stroke-width="1"
        stroke-dasharray="4,3" marker-end="url(#po-arrow)"/>
  <rect x="142" y="108" width="56" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="146" y="117">REFERENCE</text>

  <!-- 5. dvc to and from insurance data -->
  <path d="M 280,310 H 140 Q 132,310 132,302 V 220" fill="none" stroke="#475569"
        stroke-width="1" stroke-dasharray="4,3"
        marker-start="url(#po-arrow-back)" marker-end="url(#po-arrow)"/>
  <rect x="176" y="290" width="60" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="206" y="299" text-anchor="middle">PULL / PUSH</text>

  <!-- 6. dvc to and from model bundle; hops over arrow 10 -->
  <path d="M 432,310 H 548 a 8,8 0 0,1 16,0 H 596 Q 604,310 604,302 V 220"
        fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"
        marker-start="url(#po-arrow-back)" marker-end="url(#po-arrow)"/>
  <rect x="460" y="290" width="60" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="490" y="299" text-anchor="middle">PULL / PUSH</text>

  <!-- 7. dvc to github actions -->
  <path d="M 356,340 V 368 Q 356,376 348,376 H 140 Q 132,376 132,384 V 400"
        fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"
        marker-end="url(#po-arrow)"/>
  <rect x="366" y="344" width="52" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="370" y="353">DVC PULL</text>

  <!-- 8. github actions to deploy gate -->
  <line x1="208" y1="430" x2="280" y2="430" stroke="#475569" stroke-width="1.2" marker-end="url(#po-arrow)"/>
  <rect x="222" y="410" width="44" height="12" rx="2" fill="#ffffff"/>
  <text class="a" x="244" y="419" text-anchor="middle">CHECKS</text>

  <!-- 9. deploy gate to serving image -->
  <line x1="432" y1="430" x2="504" y2="430" stroke="#475569" stroke-width="1.2" marker-end="url(#po-arrow)"/>
  <rect x="450" y="410" width="36" height="12" rx="2" fill="#ffffff"/>
  <text class="a" x="468" y="419" text-anchor="middle">PASS</text>

  <!-- 10. model bundle to serving image: the arrow worth tracing twice -->
  <line x1="556" y1="220" x2="556" y2="400" stroke="#6d28d9" stroke-width="2"
        marker-end="url(#po-arrow-accent)"/>
  <rect x="466" y="259" width="82" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="544" y="268" fill="#6d28d9" text-anchor="end">BAKED AT BUILD</text>

  <!-- 11. serving image to live api -->
  <line x1="656" y1="430" x2="728" y2="430" stroke="#475569" stroke-width="1.2" marker-end="url(#po-arrow)"/>
  <rect x="670" y="410" width="44" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="692" y="419" text-anchor="middle">DEPLOY</text>

  <!-- 12. api caller to live api -->
  <line x1="804" y1="220" x2="804" y2="400" stroke="#1d4ed8" stroke-width="1.2"
        marker-end="url(#po-arrow-link)"/>
  <rect x="814" y="304" width="78" height="12" rx="2" fill="#f8fafc"/>
  <text class="a" x="818" y="313" fill="#1d4ed8">POST /PREDICT</text>

  <!-- ===== nodes ===== -->

  <rect x="56" y="40" width="152" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text class="n" x="132" y="66" text-anchor="middle">Drift check</text>
  <text class="s" x="132" y="82" text-anchor="middle">notebook 04, Evidently</text>

  <rect x="280" y="40" width="152" height="60" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <text class="n" x="356" y="66" text-anchor="middle">MLflow</text>
  <text class="s" x="356" y="82" text-anchor="middle">runs, metrics, config</text>

  <rect x="56" y="160" width="152" height="60" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <text class="n" x="132" y="186" text-anchor="middle">Insurance data</text>
  <text class="s" x="132" y="202" text-anchor="middle">data/merged_data.csv</text>

  <rect x="280" y="160" width="152" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text class="n" x="356" y="186" text-anchor="middle">Training pipeline</text>
  <text class="s" x="356" y="202" text-anchor="middle">ingest, clean, train</text>

  <rect x="504" y="160" width="152" height="60" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text class="n" x="580" y="186" text-anchor="middle">Model bundle</text>
  <text class="s" x="580" y="202" text-anchor="middle">carries use_log_target</text>

  <rect x="728" y="160" width="152" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text class="n" x="804" y="186" text-anchor="middle">API caller</text>
  <text class="s" x="804" y="202" text-anchor="middle">JSON over HTTPS</text>

  <rect x="280" y="280" width="152" height="60" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <text class="n" x="356" y="306" text-anchor="middle">DVC remote</text>
  <text class="s" x="356" y="322" text-anchor="middle">Azure Blob Storage</text>

  <rect x="56" y="400" width="152" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text class="n" x="132" y="426" text-anchor="middle">GitHub Actions</text>
  <text class="s" x="132" y="442" text-anchor="middle">push to master</text>

  <rect x="280" y="400" width="152" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="n" x="356" y="426" text-anchor="middle">Deploy gate</text>
  <text class="s" x="356" y="442" text-anchor="middle">fail = nothing ships</text>

  <rect x="504" y="400" width="152" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text class="n" x="580" y="426" text-anchor="middle">Serving image</text>
  <text class="s" x="580" y="442" text-anchor="middle">app.py, steps, model</text>

  <rect x="728" y="400" width="152" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text class="n" x="804" y="426" text-anchor="middle">Live API</text>
  <text class="s" x="804" y="442" text-anchor="middle">Azure Container Apps</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="496" x2="920" y2="496" stroke="#cbd5e1" stroke-width="0.8"/>
  <text class="z" x="40" y="516">LEGEND</text>

  <rect x="112" y="508" width="10" height="10" rx="2" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <text class="a" x="128" y="516">Data / model store</text>

  <rect x="256" y="508" width="10" height="10" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text class="a" x="272" y="516">Process</text>

  <rect x="352" y="508" width="10" height="10" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text class="a" x="368" y="516">Quality gate</text>

  <rect x="472" y="508" width="10" height="10" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text class="a" x="488" y="516">Live service</text>

  <rect x="588" y="508" width="10" height="10" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text class="a" x="604" y="516">External caller</text>

  <line x1="724" y1="513" x2="748" y2="513" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="a" x="754" y="516">Versioned / logged</text>
</svg>
